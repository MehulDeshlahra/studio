<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Studio Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="app">
 <aside id="side">
  <div class="brand"><div class="logo">S</div><div><b>Studio</b><small>Control room</small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot">
   <div class="live"><span class="pulse"></span><span id="liveTx">Connecting…</span></div>
   <button class="ghost" onclick="toggleTheme()">◐ Theme</button>
  </div>
 </aside>
 <main>
  <header class="top">
   <div class="m-brand"><div class="logo">S</div><b>Studio</b></div>
   <div id="banner" class="banner"></div>
  </header>
  <div id="view"></div>
 </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
</body>
</html>
